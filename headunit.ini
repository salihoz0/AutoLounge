# ==============================================================================
# AutoLounge - Android Auto Desktop Head Unit (DHU) Yapılandırma Dosyası
# ==============================================================================

[general]
# Dokunmatik ekran girdisi (Touch input)
touch = true

# Touchpad ve Rotary (döner teker) kontrolcüsü (Varsayılan: devre dışı, isteğe bağlı test edilebilir)
touchpad = false
rotary = false

# Medya oynatma durum bildirimleri
playbackstatus = true

# Sesli komut ve asistan testi için mikrofon desteği
mic = true

# ==============================================================================
# ÇÖZÜNÜRLÜK & DPI PROFİLLERİ (Resolution & Density)
# ==============================================================================

# ------------------------------------------------------------------------------
# Profil 1: 1080p Full HD Geniş Ekran (Varsayılan - Modern 10-14" Lüks Kokpit)
# Keskin tipografi, OLED siyah estetiği ve ergonomik dokunma alanları (240 DPI)
# ------------------------------------------------------------------------------
[resolution]
width = 1920
height = 1080
dpi = 240

# ------------------------------------------------------------------------------
# Profil 2: 720p HD Geniş Ekran (Standart 8" Araç Ekranları)
# Kullanmak için yukarıdaki [resolution] bloğunu yorumlayıp burayı açabilirsiniz:
# width = 1280
# height = 720
# dpi = 160
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Profil 3: Ultra-Geniş Curved Ekran (Mercedes MBUX / Porsche Taycan / BMW iDrive)
# width = 1920
# height = 720
# dpi = 160
# ------------------------------------------------------------------------------
